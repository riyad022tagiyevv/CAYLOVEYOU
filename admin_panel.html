<!DOCTYPE html>
<html>
<head>
    <title>Admin Paneli</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<h1>⚙ Admin Paneli</h1>

<h2>📋 Sifariş Arxivi</h2>
<div id="orders"></div>

<hr>

<h2>⚠ Cərimə əlavə et</h2>
<input id="fine" type="text" placeholder="Cərimə mətni">
<button onclick="addFine()">Əlavə et</button>

<h2>Mövcud cərimələr:</h2>
<div id="fines"></div>

<script>
function loadOrders() {
    let orders = JSON.parse(localStorage.getItem("admin_orders") || "[]");
    let div = document.getElementById("orders");
    div.innerHTML = "";

    orders.forEach(o => {
        div.innerHTML += `
            <div style='background:white;padding:20px;margin-top:15px;border-radius:10px'>
                🍽 ${o.meal} — 🪑 Masa ${o.table}<br>
                📝 ${o.note || "Qeyd yoxdur"}<br>
                ⏱ ${o.time}
            </div>
        `;
    });
}

function addFine() {
    let text = document.getElementById("fine").value;

    let fines = JSON.parse(localStorage.getItem("fines") || "[]");
    fines.push(text);
    localStorage.setItem("fines", JSON.stringify(fines));

    loadFines();
}

function loadFines() {
    let fines = JSON.parse(localStorage.getItem("fines") || "[]");
    let div = document.getElementById("fines");
    div.innerHTML = "";

    fines.forEach(f => {
        div.innerHTML += "⚠ " + f + "<br><br>";
    });
}

loadOrders();
loadFines();
</script>

</body>
</html>
